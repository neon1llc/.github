# .github/workflows/docs.yml - neon1 doc checks
#
# Lints docs and workflows, checks spelling, and validates links.

name: neon1 doc checks

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
  schedule:
    - cron: "7 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint docs and workflows
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Markdown with Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b # v24.2.0
        with:
          globs: "**/*.md"

      - name: Check docs for misspellings with Codespell
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          path: "**/*.md"

  links:
    name: Check links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # LinkedIn answers automated requests with status 999 whatever the
          # profile is, so that one host is skipped. Every other link is checked.
          args: >-
            --no-progress
            --verbose
            --exclude "^https://www.linkedin.com/"
            "**/*.md"
          fail: true

  quality:
    name: Shared workflow quality
    uses: ./.github/workflows/quality.yml
