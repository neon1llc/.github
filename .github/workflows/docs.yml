# .github/workflows/docs.yml - neon1 doc checks
#
# Lints docs and workflows, checks spelling, and validates links.

name: neon1 doc checks

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
  schedule:
    - cron: "7 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint docs and workflows
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Markdown with Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      - name: Check docs for misspellings with Codespell
        uses: codespell-project/actions-codespell@v2
        with:
          path: "**/*.md"

      - name: Check GitHub Actions workflows with Actionlint
        shell: bash
        run: |
          bash <(curl -sSfL \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  links:
    name: Check links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --verbose
            "profile/**/*.md"
          fail: true